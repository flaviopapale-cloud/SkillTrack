kground:transparent;color:#a0b3c9;padding:8px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:650;font-size:10px}.bottomnav button.active{background:#203a40;color:var(--mint)}.bottomnav .navico{font-size:20px}.no-data{color:var(--muted);font-size:13px;line-height:1.5;padding:15px;border:1px dashed #40516a;border-radius:13px}.history-card{padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:15px}.history-card strong{font-size:15px}.chart{width:100%;height:auto;max-height:240px}.chart text{font-size:10px;fill:var(--muted)}.chart polyline{fill:none;stroke:var(--mint);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart circle{fill:#c0ffee;stroke:#1a4d45;stroke-width:2}.chart line{stroke:#32445a;stroke-width:1}.modalback{position:fixed;inset:0;background:#050912cb;display:grid;place-items:center;z-index:40;padding:16px}.modal{width:min(100%,460px);max-height:calc(100dvh - 32px);overflow:auto;background:#172338;border:1px solid #3a4e65;border-radius:20px;padding:20px;box-shadow:0 30px 80px #0009}.modal h2{margin:0 0 14px;font-size:22px}.modal p{color:var(--muted);line-height:1.5;font-size:13px}.modal .buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.modal .buttons>*{flex:1}.hidden{display:none!important}.mini-divider{margin:10px 0;border-top:1px solid #334157}.legacy-line{font-size:12px;padding:5px 0;border-bottom:1px solid #2c3d55;overflow-wrap:anywhere}.footnote{color:var(--muted);font-size:11px;line-height:1.5}.tag{font-size:10px;font-weight:750;color:#9fcfe9;text-transform:uppercase;letter-spacing:1px}.textbtn{border:0;background:transparent;color:var(--mint);padding:4px;font-weight:750}.fileinput{display:none}.settings-actions{display:flex;gap:9px;flex-wrap:wrap}.tip{font-size:12px;color:var(--muted);line-height:1.55}details summary{cursor:pointer;font-weight:700;color:#d9e5f4}details p{color:var(--muted);font-size:12px;line-height:1.5}.day-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.footer-msg{font-size:12px;color:var(--muted);padding:15px 0 5px;text-align:center}#toast{position:fixed;z-index:80;left:50%;bottom:90px;transform:translateX(-50%);background:#1c5147;color:#e4fff5;border:1px solid #5ab79b;border-radius:12px;padding:12px 18px;font-size:12px;box-shadow:0 8px 30px #0007;display:none;max-width:min(92%,400px);text-align:center}

<body>
<div id="app" class="app"></div>
<div id="bottomnav" class="bottomnav" aria-label="Navigazione principale"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const STORE_KEY='skilltrack-data-v1';
const uid=()=>('id'+Math.random().toString(36).slice(2,11)+Date.now().toString(36));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nval=(x,def=0)=>Number.isFinite(Number(x))?Number(x):def;
const clamp=(x,min,max)=>Math.min(max,Math.max(min,x));
const fmt=(n,places=0)=>Number(n||0).toLocaleString('it-IT',{maximumFractionDigits:places});
const localDay=t=>new Date(t).toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'});
const clockFmt=ms=>{const s=Math.floor(Math.max(0,ms)/1000);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const unitLabel=u=>({reps:'rip.',seconds:'sec',combo:'combo',rounds:'round'}[u]||u);
const pct=(a,b)=>a>0?((b-a)/a*100):null;
const pctLabel=(a,b)=>{const p=pct(a,b);return p===null?'—':`${p>0?'+':''}${fmt(p,1)}%`};
const nowISO=()=>new Date().toISOString();
const deepClone=o=>JSON.parse(JSON.stringify(o));
const defaultVolumeEx=(name,unit='reps')=>({name,unit,target:unit==='seconds'?5:3,progression:'',assistance:'',loadKg:0});
const defaultBlock=(name,count,unit='reps',target=1,assistance='')=>({id:uid(),name,count,unit,target,progression:'',assistance,loadKg:0});
function createDefault(){const days=[
 {id:'volume-1',name:'Volume 1',weekday:'Lunedì',type:'volume',warmup:'15 min riscaldamento propedeutica (0/5/10)',conditioning:'15 min condizionamento loop (1.20/1.25/1.3)\nVIC ISO\nSpinta terra: Maltese + Planche + lean dita',duration:60,push:defaultVolumeEx('Presse'),pull:defaultVolumeEx('Touch','seconds'),notes:'Superserie spinta + tirata, 60 minuti. Target modificabile anche durante la sessione.'},
 {id:'intensity-loop',name:'Intensità Loop',weekday:'Martedì',type:'intensity',warmup:'3× riscaldamento / propedeutica',conditioning:'',duration:10,blocks:[defaultBlock('Combo spinta · Mezza supina loop · Push slow + Presse free',2,'combo'),defaultBlock('Combo tirata · Loop · PUT slow + Pull free (touch)',2,'combo'),defaultBlock('Power spinta · Elevator parallele',3,'reps',1,'Loop ++'),defaultBlock('Power tirata · Front to touch semi wide',3,'reps',1,'Loop +++')],emom:{name:'EMOM finale · Volume 2',minutes:10,unit:'reps',target:1},notes:'Nella scheda compare "2 micro"; specificarne il significato nei campi personalizzabili.'},
 {id:'volume-2',name:'Volume 2',weekday:'Giovedì',type:'volume',warmup:'15 min riscaldamento propedeutica',conditioning:'15 min condizionamento loop\nPUT deadstop\nWide planche supina + lean prone',duration:60,push:defaultVolumeEx('Mezza supina push deadstop'),pull:defaultVolumeEx('PUT & Pull'),notes:'Superserie spinta + tirata, 60 minuti.'},
 {id:'intensity-free',name:'Intensità Libero',weekday:'Venerdì / Sabato',type:'intensity',warmup:'3× riscaldamento / propedeutica',conditioning:'',duration:10,blocks:[defaultBlock('Combo spinta',2,'combo'),defaultBlock('Combo tirata',2,'combo'),defaultBlock('Set eventuale',1,'combo'),defaultBlock('Power spinta · Maltese press parallele',3,'reps',1,'Loop'),defaultBlock('Power tirata · VIC elevator + ISO',3,'reps',1,'Loop')],emom:{name:'EMOM finale · Volume 1',minutes:10,unit:'reps',target:1},notes:'Anche nella giornata Libero la scheda indica loop per alcuni power move.'}
 ];return {version:1,profile:{id:uid(),name:'Il mio profilo'},days,history:[],activeSession:null,legacyNotes:{volume1:[
 'W1 — 10 Press (10×1) + 30″ Touch (10×3″)','W2 — 20 Press (10×2) + 40″ Touch (10×4″)','W3 — 32 Press (16×2) + 80″ Touch (16×5″)','W4 — 28 Press (14×2) + 84″ Touch (14×6″)','W5 — 48 Press (10×3 / 9×2) + 114″ Touch (19×6″)','W6 — 43 Press (11×3 / 5×2) + 112″ Touch (16×7″)','W7 — 45 Press (15×3) + 120″ Touch (15×8″)','W8 — 48 Press (6×4 / 8×3) + 126″ Touch (14×9″)','W9 — 48 Press (12×4) + 120″ Touch (12×10″)','W10 — 48 Press (12×4) + 48″ Touch +1 kg (12×4″)','W11 — 60 Press (20×1/1/1) + 100″ Touch +1 kg (20×5″)','W12 — 54 Press (18×2/1) + 108″ Touch +1 kg (18×6″)','W13 — 51 Press (17×3) + 119″ Touch +1 kg (17×7″)'],volume2:[
 'W1 — 45″ PLmSupi + 45 Pull Up (15×3″ +3)','W2 — 68″ PLmSupi + 68 Pull Up (17×4″ +4)','W3 — 90″ PLmSupi + 90 Pull Up (18×5″ +5)','W4 — 120″ PLmSupi + 120 Pull Up (20×6″ +6)','W5 — 126″ PLmSupi + 126 Pull Up (18×7″ +7)','W6 — 136″ PLmSupi + 136 Pull Up (17×8″ +8)','W7 — 126″ PLmSupi + 126 Pull Up (14×9″ +9)','W8 — +1 kg, 80″ PLSup + 80 PulWideReg (20×4″ +1/3)','W9 — +1 kg, 90″ PLSup + 90 PulWideReg (18×5″ +1/4)','W10 — +1 kg, 96″ PLSup + 80 PulWideReg (16×6″ +2/3)','W11 — +1 kg, 112″ PLSup + 96 PulWideReg (16×7″ +2/4)','W12 — +1 kg, 112″ PLSup + 84 PulW+Reg (14×8″ +3/3)','W13 — +1 kg, 117″ PLSup + 91 PulW+Reg (13×9″ +3/4)']}}}
function load(){try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null');if(saved&&saved.version===1&&Array.isArray(saved.days)&&Array.isArray(saved.history)){const starter=createDefault();return {...starter,...saved,legacyNotes:saved.legacyNotes||starter.legacyNotes,manualTextNotes:saved.manualTextNotes||''};}}catch(e){console.warn('Backup locale non leggibile',e)}return createDefault()}
let data=load();let screen='home',selectedDayId=null,selectedHistoryId=null,statDayId=null,editDayId=null;let currentModal=null;let toastTimeout;
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(data))}catch(e){toast('Spazio del dispositivo non disponibile. Esporta subito un backup.')}}
function toast(message){const e=document.getElementById('toast');e.textContent=message;e.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.style.display='none',2600)}
function getDay(id){return data.days.find(d=>d.id===id)}
function getSession(){return data.activeSession}
function getLastSession(dayId){return data.history.filter(s=>s.dayId===dayId).sort((a,b)=>b.endedAt.localeCompare(a.endedAt))[0]}
function elapsed(c){if(!c)return 0;return (c.elapsedMs||0)+(c.startedAt?Date.now()-c.startedAt:0)}
function sessionEntries(s){return Array.isArray(s?.entries)?s.entries:[]}
function validEntries(s,side){return sessionEntries(s).filter(x=>x.side===side&&x.valid!==false)}
function summarize(s){if(!s)return {};const p=validEntries(s,'push'),q=validEntries(s,'pull');return {push:p.length,pull:q.length,sets:p.length+q.length,pushReps:p.filter(x=>x.unit==='reps').reduce((a,x)=>a+x.value,0),pullReps:q.filter(x=>x.unit==='reps').reduce((a,x)=>a+x.value,0),pushSeconds:p.filter(x=>x.unit==='seconds').reduce((a,x)=>a+x.value,0),pullSeconds:q.filter(x=>x.unit==='seconds').reduce((a,x)=>a+x.value,0),completePairs:new Set(p.filter(x=>x.groupId&&q.some(y=>y.groupId===x.groupId)).map(x=>x.groupId)).size}}
function signature(e){return [e.side,e.exerciseName,e.unit,e.progression||'',e.assistance||'',e.loadKg||0,e.target].join('|').toLowerCase().trim()}
function comparable(s1,s2,side){const v1=validEntries(s1,side),v2=validEntries(s2,side);if(!v1.length||!v2.length)return false;const one=new Set(v1.map(signature)),two=new Set(v2.map(signature));return one.size===1&&two.size===1&&[...one][0]===[...two][0]&&(s1.durationMin||60)===(s2.durationMin||60)}
function go(to){screen=to;document.body.scrollTop=0;window.scrollTo({top:0,behavior:'instant'});render()}
const nav=[['home','⌂','Home'],['training','◉','Allenamento'],['history','▤','Storico'],['stats','↗','Progressi'],['plan','☷','Scheda']];
function header(){return `<header class="header"><div class="brand"><div class="brandmark">S</div><div><small>Calisthenics skills</small><h1>SkillTrack</h1></div></div><button class="small-btn" data-action="settings" aria-label="Impostazioni">⚙︎ Impostazioni</button></header>`}
function navHTML(){return nav.map(([id,icon,label])=>`<button type="button" data-action="goto" data-to="${id}" class="${screen===id?'active':''}" aria-label="${label}"><span class="navico">${icon}</span><span>${label}</span></button>`).join('')}
function dayCard(day,i,action='start'){return `<button class="day-card ${day.type==='volume'?'volume':'intensity'}" data-action="${action}" data-day="${esc(day.id)}"><div class="row"><span class="daynumber">GIORNO ${i+1}</span><span class="pill ${day.type==='volume'?'mint':'peach'}">${day.type==='volume'?'Volume':'Intensità'}</span></div><strong>${esc(day.name)}</strong><span class="muted" style="font-size:12px">${esc(day.weekday||'Giornata libera')} · ${day.type==='volume'?`${day.duration||60} min blocco`:`${day.blocks?.reduce((a,b)=>a+b.count,0)||0} serie + finale`}</span><span class="arrow">→</span></button>`}
function home(){const recent=[...data.history].sort((a,b)=>b.endedAt.localeCompare(a.endedAt)).slice(0,3);const nextDay=data.days.length?data.days[(data.days.findIndex(d=>d.id===recent[0]?.dayId)+1)%data.days.length]:null;return `<div class="page-head"><div class="eyebrow">Il tuo diario di allenamento</div><h2>Un allenamento alla volta.<br>Progressi misurabili.</h2><p>Quattro giornate iniziali, esercizi completamente personalizzabili. I dati restano su questo dispositivo.</p></div>${data.activeSession?`<div class="panel hero" style="margin-bottom:14px"><div class="eyebrow">Sessione in corso</div><h3>${esc(data.activeSession.dayName)}</h3><p class="muted">Hai un allenamento non ancora concluso.</p><button class="btn full" data-action="goto" data-to="training">Riprendi allenamento →</button></div>`:''}<div class="panel hero"><div class="eyebrow">${nextDay?'Prossima giornata suggerita':'Inizia da qui'}</div><h3 style="font-size:25px;margin:6px 0">${esc(nextDay?.name||'Personalizza la tua scheda')}</h3><p class="muted" style="font-size:13px;line-height:1.5">La sequenza è flessibile: puoi scegliere qualsiasi giornata, anche fuori calendario.</p>${nextDay?`<button class="btn" data-action="start" data-day="${esc(nextDay.id)}">Prepara questa sessione ↗</button>`:`<button class="btn" data-action="goto" data-to="plan">Apri scheda</button>`}</div><div class="section-title"><h3>Le tue giornate</h3><span>${data.days.length} in programma</span></div><div class="grid2">${data.days.map((d,i)=>dayCard(d,i)).join('')}</div><div class="section-title"><h3>Ultime sessioni</h3><button class="textbtn" data-action="goto" data-to="history">Vedi tutte</button></div>${recent.length?`<div class="stack">${recent.map(s=>historyCard(s)).join('')}</div>`:'<div class="no-data">Nessun allenamento registrato. Quando concluderai la prima sessione compariranno qui risultati e confronti.</div>'}${foot()}`}
function foot(){return `<div class="footer-msg">SkillTrack v1.1 · Registro locale · Backup disponibile in Impostazioni</div>`}
function selectTraining(){if(data.activeSession)return sessionView();return `<div class="page-head"><div class="eyebrow">Nuovo allenamento</div><h2>Che giornata facciamo?</h2><p>Ogni sessione carica i target della tua scheda. Potrai modificarli senza cambiare i risultati già salvati.</p></div><div class="grid2">${data.days.map((d,i)=>dayCard(d,i)).join('')}</div>`}
function startSession(id){if(data.activeSession){toast('Concludi o elimina prima la sessione attiva');go('training');return}const day=getDay(id);if(!day)return;const s={id:uid(),dayId:day.id,dayName:day.name,dayType:day.type,startedAt:nowISO(),endedAt:null,warmup:day.warmup,conditioning:day.conditioning,notes:day.notes||'',durationMin:day.duration||60,clock:{elapsedMs:0,startedAt:null},entries:[],daySnapshot:deepClone(day)};if(day.type==='volume'){s.targets={push:deepClone(day.push),pull:deepClone(day.pull)}}else{s.blocks=deepClone(day.blocks||[]);s.emom=deepClone(day.emom||{name:'EMOM',minutes:10,unit:'reps',target:1});s.blockLog={};s.emomLog={}}data.activeSession=s;save();go('training')}
function clockView(s){const ms=elapsed(s.clock),target=(s.durationMin||60)*60000,left=target-ms;return `<div class="panel"><div class="row"><span class="eyebrow">Timer blocco principale</span><span class="pill ${left>0?'mint':'peach'}" id="clock-status">${left>0?'60 min obiettivo':'Tempo raggiunto'}</span></div><div id="main-timer" class="timer ${s.clock.startedAt?'active':''} ${left<=0?'done':''}">${left>0?clockFmt(left):'+'+clockFmt(-left)}</div><div class="progress"><div id="main-progress" style="width:${Math.min(100,100*ms/target)}%"></div></div><div class="row top-gap gap8"><button class="btn ${s.clock.startedAt?'secondary':'soft'}" style="flex:1" data-action="timer">${s.clock.startedAt?'⏸ Pausa':'▶ '+(s.clock.elapsedMs>0?'Riprendi':'Avvia 60 min')}</button><button class="btn secondary" data-action="reset-timer">↺</button></div><p class="tip" style="margin-bottom:0">Avvia il timer quando cominci il blocco di volume, dopo il riscaldamento. È indipendente dagli altri blocchi della giornata.</p></div>`}
function exerciseView(side,x,s){const entries=validEntries(s,side);return `<section class="exercise ${side}"><div class="row"><span class="tag">${side==='push'?'SPINTA':'TIRATA'}</span><span class="pill grey">${entries.length} serie valide</span></div><h3>${esc(x.name||'Esercizio')}</h3><div class="targetrow"><div><span class="label">Target prossima serie</span><div class="stepper"><button data-action="step-target" data-side="${side}" data-delta="-1" aria-label="Diminuisci target">−</button><strong>${fmt(x.target,1)}</strong><button data-action="step-target" data-side="${side}" data-delta="1" aria-label="Aumenta target">+</button></div></div><div class="field" style="width:112px"><label>Unità</label><select data-target-field="unit" data-side="${side}"><option value="reps" ${x.unit==='reps'?'selected':''}>Ripetizioni</option><option value="seconds" ${x.unit==='seconds'?'selected':''}>Secondi</option><option value="combo" ${x.unit==='combo'?'selected':''}>Combo</option></select></div></div><div class="mini-fields"><div><label>Progressione / variante</label><input data-target-field="progression" data-side="${side}" value="${esc(x.progression)}" placeholder="es. advanced tuck"></div><div><label>Loop / assistenza</label><input data-target-field="assistance" data-side="${side}" value="${esc(x.assistance)}" placeholder="es. loop verde"></div><div><label>Sovraccarico (kg)</label><input type="number" step="0.5" data-target-field="loadKg" data-side="${side}" value="${esc(x.loadKg||0)}"></div><div><label>Target esatto</label><input type="number" min="0" step="0.5" data-target-field="target" data-side="${side}" value="${esc(x.target)}"></div></div><div class="row top-gap"><span class="tip">${fmt(entries.reduce((a,e)=>a+e.value,0),1)} ${unitLabel(x.unit)} registrati*</span><button class="btn sm secondary" data-action="add-single" data-side="${side}">+ Solo ${side==='push'?'spinta':'tirata'}</button></div></section>`}
function volumeView(s){const total=summarize(s);const groups=sessionEntries(s).slice().reverse();const prev=getLastSession(s.dayId);return `<div class="page-head"><div class="row between-top"><div><div class="eyebrow">Sessione in corso · Volume</div><h2>${esc(s.dayName)}</h2></div><button class="small-btn" data-action="finish">Concludi</button></div><p>${esc(s.warmup||'')} · blocco principale ${s.durationMin} min</p></div><div class="main-columns"><div class="stack">${clockView(s)}<details class="panel-plain"><summary>Riscaldamento, condizionamento e note</summary><p>${esc(s.warmup||'—').replace(/\n/g,'<br>')}</p><p>${esc(s.conditioning||'—').replace(/\n/g,'<br>')}</p><p>${esc(s.notes||'').replace(/\n/g,'<br>')}</p></details></div><div class="stack">${exerciseView('push',s.targets.push,s)}${exerciseView('pull',s.targets.pull,s)}<button class="btn xl full" data-action="add-pair">＋ Registra superserie</button><div class="grid3"><div class="stat"><strong>${total.sets}</strong><small>Serie valide</small></div><div class="stat"><strong>${total.completePairs}</strong><small>Superserie</small></div><div class="stat"><strong>${fmt(elapsed(s.clock)/60000,0)}′</strong><small>Tempo attivo</small></div></div>${prev?`<p class="tip">Precedente: ${summarize(prev).sets} serie valide. ${comparable(prev,s,'push')?'Spinta confrontabile.':'Verifica target e progressione per la spinta.'} ${comparable(prev,s,'pull')?'Tirata confrontabile.':'Verifica target e progressione per la tirata.'}</p>`:''}</div></div><div class="section-title"><h3>Serie registrate</h3><span>${groups.length} movimenti</span></div>${groups.length?`<div class="log-list">${groups.map((e,i)=>logRow(e,groups.length-i,s)).join('')}</div>`:'<div class="no-data">Registra una superserie con un solo tocco, oppure aggiungi spinta e tirata separatamente. Ogni serie è modificabile.</div>'}<div class="row top-gap"><button class="btn secondary" data-action="finish">Concludi e salva</button><button class="btn danger sm" data-action="delete-active">Elimina sessione</button></div>${foot()}`}
function logRow(e,num,s){return `<div class="log-item"><div><div class="log-label">${e.side==='push'?'↗ Spinta':'↙ Tirata'} · ${fmt(e.value,1)} ${unitLabel(e.unit)} ${e.valid===false?'⚠':''}</div><small>${esc(e.exerciseName)}${e.progression?' · '+esc(e.progression):''}${e.assistance?' · '+esc(e.assistance):''}${e.elapsedMs!=null?' · '+clockFmt(e.elapsedMs):''}</small></div><button class="btn sm secondary" data-action="edit-entry" data-session="${esc(s.id)}" data-entry="${esc(e.id)}">Modifica</button></div>`}
function intensityView(s){const total=s.blocks.reduce((a,b)=>a+(s.blockLog[b.id]?.filter(Boolean).length||0),0);const goal=s.blocks.reduce((a,b)=>a+b.count,0);const minutes=s.emom.minutes||10;return `<div class="page-head"><div class="row between-top"><div><div class="eyebrow">Sessione in corso · Intensità</div><h2>${esc(s.dayName)}</h2></div><button class="small-btn" data-action="finish">Concludi</button></div><p>Combo, power move e finale a intervalli. Puoi modificare ogni singola serie.</p></div><div class="panel hero"><div class="row"><span class="eyebrow">Serie programmate</span><span class="pill mint">${total}/${goal}</span></div><div class="progress top-gap"><div style="width:${goal?Math.min(100,total/goal*100):0}%"></div></div><details class="top-gap"><summary>Riscaldamento e note</summary><p>${esc(s.warmup||'—').replace(/\n/g,'<br>')}</p><p>${esc(s.notes||'—').replace(/\n/g,'<br>')}</p></details></div><div class="stack top-gap">${s.blocks.map((b,i)=>intensityBlock(s,b,i)).join('')}</div><div class="panel top-gap"><div class="row"><div><div class="eyebrow">Finale</div><h3 style="margin:5px 0">${esc(s.emom.name||'EMOM')}</h3></div><span class="pill peach">${minutes} minuti</span></div><div class="row gap8"><span class="tip">Tocca un minuto per completarlo, tocca di nuovo per modificarlo.</span><button class="btn sm secondary" data-action="reset-emom-clock">↺ Timer</button></div><div class="timer" style="font-size:43px" id="emom-timer">${clockFmt(s.emomClock?elapsed(s.emomClock):0)}</div><button class="btn full secondary" data-action="emom-clock">${s.emomClock?.startedAt?'⏸ Pausa':'▶ Avvia / Riprendi'}</button><div class="emom-grid">${Array.from({length:minutes},(_,i)=>{const item=s.emomLog[i];return `<button class="series-chip ${item?(item.valid?'ok':'bad'):''}" data-action="toggle-round" data-index="${i}">${i+1}${item?' ✓':''}</button>`}).join('')}</div><p class="tip">Ogni minuto può essere registrato come completato oppure non completato, con risultato personalizzato.</p></div><div class="row top-gap"><button class="btn" data-action="finish">Concludi e salva</button><button class="btn danger sm" data-action="delete-active">Elimina sessione</button></div>${foot()}`}
function intensityBlock(s,b,i){const logged=s.blockLog[b.id]||[];return `<div class="block-item"><div class="row"><span class="tag">BLOCCO ${i+1}</span><span class="pill grey">${logged.filter(Boolean).length}/${b.count}</span></div><h3>${esc(b.name)}</h3><div class="row wrap"><span class="tip">Target ${fmt(b.target||1,1)} ${unitLabel(b.unit)}${b.assistance?' · '+esc(b.assistance):''}</span><button class="btn sm secondary" data-action="edit-block-target" data-block="${esc(b.id)}">Modifica target</button></div><div class="series-list">${Array.from({length:b.count},(_,k)=>{const item=logged[k];return `<button class="series-chip ${item?(item.valid?'ok':'bad'):''}" data-action="record-intensity" data-block="${esc(b.id)}" data-index="${k}">Serie ${k+1} ${item?'✓':''}</button>`}).join('')}</div></div>`}
function sessionView(){const s=data.activeSession;return s.dayType==='volume'?volumeView(s):intensityView(s)}
function historyCard(s){const m=s.dayType==='volume'?summarize(s):null;const count=s.dayType==='intensity'?Object.values(s.blockLog||{}).reduce((a,v)=>a+v.filter(Boolean).length,0):m?.sets;return `<div class="history-card"><div class="row"><div><span class="tag">${esc(localDay(s.endedAt||s.startedAt))}</span><div style="margin-top:4px"><strong>${esc(s.dayName||'Allenamento')}</strong></div><span class="muted" style="font-size:12px">${s.dayType==='volume'?`${count} serie · ${m.completePairs} superserie`:`${count} serie + ${Object.keys(s.emomLog||{}).length} intervalli`} </span></div><button class="btn sm secondary" data-action="open-history" data-session="${esc(s.id)}">Apri →</button></div></div>`}
function historyView(){if(selectedHistoryId)return historyDetail();const sorted=[...data.history].sort((a,b)=>b.endedAt.localeCompare(a.endedAt));return `<div class="page-head"><div class="eyebrow">Archivio</div><h2>Il tuo storico</h2><p>Ogni sessione resta consultabile e correggibile. Le modifiche ai target futuri non riscrivono i risultati passati.</p></div><div class="section-title"><h3>${sorted.length} allenamenti completati</h3></div>${sorted.length?`<div class="stack">${sorted.map(historyCard).join('')}</div>`:'<div class="no-data">Non hai ancora sessioni completate. Le annotazioni W1–W13 del PDF sono conservate separatamente nella sezione Scheda → Storico originale, perché alcune abbreviazioni richiedono conferma.</div>'}`}
function historyDetail(){const s=data.history.find(x=>x.id===selectedHistoryId);if(!s){selectedHistoryId=null;return historyView()}const isV=s.dayType==='volume',m=isV?summarize(s):null;return `<button class="small-btn" data-action="history-back">← Tutti gli allenamenti</button><div class="page-head"><span class="eyebrow">${esc(localDay(s.endedAt||s.startedAt))}</span><h2>${esc(s.dayName)}</h2><p>Risultati salvati e modificabili.</p></div>${isV?`<div class="grid3"><div class="stat"><strong>${m.sets}</strong><small>Serie valide</small></div><div class="stat"><strong>${m.push}</strong><small>Spinta</small></div><div class="stat"><strong>${m.pull}</strong><small>Tirata</small></div></div><div class="section-title"><h3>Dettaglio serie</h3></div><div class="log-list">${s.entries.map((e,i)=>logRow(e,i+1,s)).join('')||'<div class="no-data">Nessuna serie</div>'}</div>`:`<div class="stack">${s.blocks.map((b,i)=>`<div class="panel-plain"><strong>${esc(b.name)}</strong>${Array.from({length:b.count},(_,k)=>{const e=(s.blockLog[b.id]||[])[k];return e?`<div class="log-item top-gap"><span>${k+1}. ${fmt(e.value,1)} ${unitLabel(e.unit)} ${e.valid?'✓':'non valida'}</span><button class="btn sm secondary" data-action="edit-intensity-saved" data-session="${esc(s.id)}" data-block="${esc(b.id)}" data-index="${k}">Modifica</button></div>`:''}).join('')||'<p class="tip">Non registrato</p>'}</div>`).join('')}<div class="panel-plain"><strong>Finale · ${esc(s.emom.name)}</strong><p class="tip">Minuti completati: ${Object.values(s.emomLog||{}).filter(x=>x.valid).length}/${s.emom.minutes}</p><div class="emom-grid">${Array.from({length:s.emom.minutes},(_,i)=>`<button class="series-chip ${s.emomLog?.[i]?(s.emomLog[i].valid?'ok':'bad'):''}" data-action="edit-round-saved" data-session="${esc(s.id)}" data-index="${i}">${i+1}</button>`).join('')}</div></div></div>`}<div class="panel-plain top-gap"><label class="label">Note della sessione</label><textarea data-history-notes="${esc(s.id)}">${esc(s.notes||'')}</textarea></div><button class="btn danger sm top-gap" data-action="delete-history" data-session="${esc(s.id)}">Elimina questa sessione</button>`}
function smallChart(points){if(!points.length)return '<div class="no-data">Non ci sono ancora abbastanza dati per un grafico.</div>';const w=340,h=170,pad=26,values=points.map(x=>x.val),mi=Math.min(...values,0),ma=Math.max(...values,1),range=Math.max(1,ma-mi),x=i=>pad+(points.length===1?0:i*(w-2*pad)/(points.length-1)),y=v=>h-pad-(v-mi)/range*(h-2*pad);return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Andamento delle serie per sessione">${[0,.5,1].map(t=>`<line x1="${pad}" y1="${pad+t*(h-2*pad)}" x2="${w-pad}" y2="${pad+t*(h-2*pad)}"/>`).join('')}<polyline points="${points.map((o,i)=>`${x(i)},${y(o.val)}`).join(' ')}"/>${points.map((o,i)=>`<circle cx="${x(i)}" cy="${y(o.val)}" r="4"/><text x="${x(i)}" y="${h-4}" text-anchor="middle">${esc(o.lab)}</text>`).join('')}</svg>`}
function statsView(){const day=data.days.find(x=>x.id===statDayId)||data.days[0];if(!day)return '<div class="no-data">Aggiungi una giornata nella scheda.</div>';const sessions=data.history.filter(x=>x.dayId===day.id).sort((a,b)=>a.endedAt.localeCompare(b.endedAt)),vol=day.type==='volume';const previous=sessions.at(-2),latest=sessions.at(-1);let trend=sessions.map((s,i)=>({lab:String(i+1),val:vol?summarize(s).sets:Object.values(s.blockLog||{}).reduce((a,v)=>a+v.filter(e=>e.valid).length,0)}));const comparison=vol&&previous&&latest?summarize(previous):null,latestMetrics=vol&&latest?summarize(latest):null;return `<div class="page-head"><div class="eyebrow">Analisi e progressioni</div><h2>I tuoi progressi</h2><p>Confronti onesti: i miglioramenti percentuali tra serie sono affidabili solo a condizioni equivalenti.</p></div><div class="panel"><div class="field"><label>Giornata da analizzare</label><select id="stats-day" data-action="select-stats-day">${data.days.map(d=>`<option value="${esc(d.id)}" ${d.id===day.id?'selected':''}>${esc(d.name)} (${d.type==='volume'?'Volume':'Intensità'})</option>`).join('')}</select></div><div class="grid3 top-gap"><div class="stat"><strong>${sessions.length}</strong><small>Sessioni</small></div><div class="stat"><strong>${latest?trend.at(-1).val:'—'}</strong><small>${vol?'Ultime serie valide':'Ultime serie valide'}</small></div><div class="stat"><strong class="${previous&&latest&&trend.at(-1).val>=trend.at(-2).val?'pos':''}">${previous&&latest?pctLabel(trend.at(-2).val,trend.at(-1).val):'—'}</strong><small>Variazione grezza</small></div></div><div class="section-title"><h3>Andamento delle serie</h3><span>Per sessione</span></div>${smallChart(trend)}${vol&&previous&&latest?`<div class="panel-plain"><h3 style="margin-top:0">Confronto con la seduta precedente</h3>${['push','pull'].map(side=>{const ok=comparable(previous,latest,side),a=summarize(previous)[side],b=latestMetrics[side];return `<div class="row" style="margin-top:11px"><div><strong>${side==='push'?'Spinta':'Tirata'}</strong><div class="tip">${a} → ${b} serie valide</div></div><div style="text-align:right"><strong style="color:${ok?'var(--mint)':'var(--muted)'}">${ok?pctLabel(a,b):'Non comparabile'}</strong><div class="tip">${ok?'Stesso esercizio, progressione, assistenza e target':'Condizioni diverse o target variabili'}</div></div></div>`}).join('')}</div>`:''}<p class="tip top-gap">Il grafico mostra il numero grezzo di serie. Non esprime da solo un aumento di forza: se cambia la difficoltà o il target, il confronto è segnalato separatamente.</p></div>${vol&&latest?`<div class="section-title"><h3>Ultimo volume registrato</h3></div><div class="grid2"><div class="stat"><strong>${latestMetrics.pushReps}</strong><small>Rip. spinta</small></div><div class="stat"><strong>${latestMetrics.pullReps}</strong><small>Rip. tirata</small></div><div class="stat"><strong>${fmt(latestMetrics.pushSeconds,1)}″</strong><small>Tenute spinta</small></div><div class="stat"><strong>${fmt(latestMetrics.pullSeconds,1)}″</strong><small>Tenute tirata</small></div></div>`:''}<div class="note top-gap">Le percentuali mensili andranno calcolate confrontando inizio e fine periodo (o medie confrontabili), non sommando le percentuali settimanali. I dati dello storico PDF non sono inclusi finché non ne avremo chiarito la notazione.</div>`}
function planDayCard(d,i){return `<div class="panel-plain"><div class="row between-top"><div><span class="tag">Giorno ${i+1} · ${esc(d.weekday||'Libero')}</span><h3 style="margin:4px 0">${esc(d.name)}</h3><span class="pill ${d.type==='volume'?'mint':'peach'}">${d.type==='volume'?'Volume':'Intensità'}</span></div><button class="btn sm secondary" data-action="edit-plan-day" data-day="${esc(d.id)}">Modifica</button></div><div class="tip top-gap">${d.type==='volume'?`Spinta: ${esc(d.push.name)}<br>Tirata: ${esc(d.pull.name)}<br>${d.duration} minuti di superserie`:`${d.blocks.length} blocchi · ${d.emom.minutes} minuti finale`}</div></div>`}
function planView(){if(editDayId)return planEditor();return `<div class="page-head"><div class="eyebrow">La tua programmazione</div><h2>Scheda modificabile</h2><p>Giornate, nomi, target e blocchi sono configurabili. Puoi creare una scheda da 3, 4, 5 o più giorni.</p></div><div class="stack">${data.days.map(planDayCard).join('')}</div><button class="btn full top-gap" data-action="add-day">＋ Aggiungi giornata</button><div class="panel top-gap"><h3 style="margin:0 0 7px">📜 Storico originale W1–W13</h3><p class="tip">Riportato come appunti testuali dal PDF del coach. Non entra nei grafici perché contiene abbreviazioni e progressioni non ancora verificate.</p><details><summary>Volume 1 (W1–W13)</summary><div class="top-gap">${(data.legacyNotes?.volume1||[]).map(x=>`<div class="legacy-line">${esc(x)}</div>`).join('')}</div></details><div class="mini-divider"></div><details><summary>Volume 2 (W1–W13)</summary><div class="top-gap">${(data.legacyNotes?.volume2||[]).map(x=>`<div class="legacy-line">${esc(x)}</div>`).join('')}</div></details></div>`}
function planEditor(){const d=getDay(editDayId);if(!d){editDayId=null;return planView()}return `<button class="small-btn" data-action="close-edit-day">← Torna alla scheda</button><div class="page-head"><div class="eyebrow">Personalizzazione</div><h2>${esc(d.name)}</h2><p>Le modifiche si applicano alle sessioni future. Lo storico non viene riscritto.</p></div><div class="stack"><div class="panel"><div class="field-grid"><div class="field"><label>Nome giornata</label><input data-day-field="name" value="${esc(d.name)}"></div><div class="field"><label>Giorno indicativo</label><input data-day-field="weekday" value="${esc(d.weekday||'')}"></div></div><div class="field top-gap"><label>Riscaldamento / propedeutica</label><textarea data-day-field="warmup">${esc(d.warmup||'')}</textarea></div><div class="field top-gap"><label>Condizionamento</label><textarea data-day-field="conditioning">${esc(d.conditioning||'')}</textarea></div><div class="field top-gap"><label>Note libere</label><textarea data-day-field="notes">${esc(d.notes||'')}</textarea></div></div>${d.type==='volume'?`<div class="panel"><h3>Blocco di volume</h3><div class="field"><label>Durata in minuti</label><input data-day-field="duration" type="number" min="1" max="360" value="${esc(d.duration)}"></div>${['push','pull'].map(side=>`<div class="panel-plain top-gap"><h3>${side==='push'?'Spinta':'Tirata'}</h3>${editorExercise(side,d[side])}</div>`).join('')}</div>`:`<div class="panel"><h3>Blocchi di intensità</h3><div class="stack">${d.blocks.map((b,i)=>`<div class="panel-plain"><div class="row"><strong>Blocco ${i+1}</strong><button class="btn sm danger" data-action="delete-block" data-block="${esc(b.id)}">Rimuovi</button></div>${editorBlock(b)}</div>`).join('')}</div><button class="btn secondary full top-gap" data-action="add-block">+ Aggiungi blocco</button><div class="panel-plain top-gap"><h3>Finale a intervalli</h3><div class="field-grid"><div class="field"><label>Nome</label><input data-emom-field="name" value="${esc(d.emom.name)}"></div><div class="field"><label>Minuti</label><input type="number" min="1" max="60" data-emom-field="minutes" value="${esc(d.emom.minutes)}"></div><div class="field"><label>Target per minuto</label><input type="number" min="0" step="0.5" data-emom-field="target" value="${esc(d.emom.target)}"></div><div class="field"><label>Unità</label><select data-emom-field="unit">${unitOptions(d.emom.unit)}</select></div></div></div></div>`}<div class="row wrap"><button class="btn" data-action="close-edit-day">✓ Fatto</button><button class="btn danger sm" data-action="remove-day" data-day="${esc(d.id)}">Elimina giornata</button></div></div>`}
function unitOptions(cur){return ['reps','seconds','combo'].map(x=>`<option value="${x}" ${cur===x?'selected':''}>${unitLabel(x)}</option>`).join('')}
function editorExercise(side,e){return `<div class="field-grid"><div class="field"><label>Nome esercizio</label><input data-ex-field="name" data-side="${side}" value="${esc(e.name)}"></div><div class="field"><label>Unità</label><select data-ex-field="unit" data-side="${side}">${unitOptions(e.unit)}</select></div><div class="field"><label>Target</label><input type="number" min="0" step="0.5" data-ex-field="target" data-side="${side}" value="${esc(e.target)}"></div><div class="field"><label>Progressione</label><input data-ex-field="progression" data-side="${side}" value="${esc(e.progression||'')}"></div><div class="field"><label>Assistenza / loop</label><input data-ex-field="assistance" data-side="${side}" value="${esc(e.assistance||'')}"></div><div class="field"><label>Sovraccarico kg</label><input type="number" step="0.5" data-ex-field="loadKg" data-side="${side}" value="${esc(e.loadKg||0)}"></div></div>`}
function editorBlock(b){return `<div class="field"><label>Esercizio / combo</label><input data-block-field="name" data-block="${esc(b.id)}" value="${esc(b.name)}"></div><div class="field-grid top-gap"><div class="field"><label>Numero serie</label><input type="number" min="1" max="100" data-block-field="count" data-block="${esc(b.id)}" value="${esc(b.count)}"></div><div class="field"><label>Unità</label><select data-block-field="unit" data-block="${esc(b.id)}">${unitOptions(b.unit)}</select></div><div class="field"><label>Target serie</label><input type="number" min="0" step="0.5" data-block-field="target" data-block="${esc(b.id)}" value="${esc(b.target)}"></div><div class="field"><label>Loop / assistenza</label><input data-block-field="assistance" data-block="${esc(b.id)}" value="${esc(b.assistance||'')}"></div><div class="field"><label>Progressione</label><input data-block-field="progression" data-block="${esc(b.id)}" value="${esc(b.progression||'')}"></div><div class="field"><label>Sovraccarico (kg)</label><input type="number" step="0.5" data-block-field="loadKg" data-block="${esc(b.id)}" value="${esc(b.loadKg||0)}"></div></div>`}
function settings(){return `<div class="page-head"><div class="eyebrow">Dati e sicurezza</div><h2>Impostazioni</h2><p>La prima versione è pensata per un profilo locale. La struttura delle giornate è già variabile.</p></div><div class="panel"><div class="field"><label>Nome profilo</label><input id="profile-name" value="${esc(data.profile.name||'Il mio profilo')}"></div><button class="btn sm top-gap" data-action="save-profile">Salva nome</button><hr class="divider"><h3>Backup dei dati</h3><p class="tip">I dati sono salvati nel browser di questo dispositivo. Se cancelli i dati del browser o cambi telefono, potresti perderli: esporta periodicamente un backup.</p><div class="settings-actions"><button class="btn secondary" data-action="export">⬇ Backup JSON</button><button class="btn secondary" data-action="import">⬆ Ripristina JSON</button><input id="backup-file" class="fileinput" type="file" accept="application/json,.json"></div><hr class="divider"><h3>Diario testuale per Note</h3><p class="tip">Esporta uno storico in formato leggibile e modificabile: W1, W2, serie, ripetizioni, secondi, abbreviazioni, note e storico originale del PDF. Puoi copiarlo direttamente in Note oppure scaricarlo come .txt. Le modifiche fatte in Note non vengono sincronizzate nell'app.</p><button class="btn full top-gap" data-action="open-text-diary">✎ Apri diario in testo</button><div class="field top-gap"><label>Appunti personali e abbreviazioni (salvati nell'app ed esportati nel TXT)</label><textarea id="manual-text-notes" placeholder="Es. W14 - 5xRamp MalteseDita + Elev. Supi + ISOProno">${esc(data.manualTextNotes||'')}</textarea></div><p class="tip">Per poter ripristinare tutti i risultati automaticamente, conserva anche il backup JSON.</p><hr class="divider"><h3>Installazione PWA</h3><p class="tip">Per installarla dalla schermata Home, pubblica la cartella su un sito HTTPS (ad esempio GitHub Pages). Su iPhone: Safari → Condividi → Aggiungi a schermata Home. Su Android: Chrome → Installa app / Aggiungi a schermata Home.</p><hr class="divider"><h3>Più persone in futuro</h3><p class="tip">Il modello di dati usa già un identificatore profilo e un elenco modificabile di giornate. Un'app per utenti diversi, con login e sincronizzazione cloud, richiederà una seconda fase: questa versione non condivide i dati online.</p></div><button class="btn secondary top-gap" data-action="goto" data-to="home">← Home</button>`}
function render(){const view=screen==='home'?home():screen==='training'?selectTraining():screen==='history'?historyView():screen==='stats'?statsView():screen==='plan'?planView():settings();document.getElementById('app').innerHTML=header()+view;document.getElementById('bottomnav').innerHTML=navHTML();updateTimers()}
function updateTimers(){const s=getSession();if(!s||screen!=='training')return;if(s.dayType==='volume'){const e=document.getElementById('main-timer');if(e){const ms=elapsed(s.clock),target=(s.durationMin||60)*60000,left=target-ms;e.textContent=left>0?clockFmt(left):'+'+clockFmt(-left);e.classList.toggle('active',Boolean(s.clock.startedAt));e.classList.toggle('done',left<=0);const p=document.getElementById('main-progress');if(p)p.style.width=Math.min(100,ms/target*100)+'%';const status=document.getElementById('clock-status');if(status)status.textContent=left>0?`${s.durationMin} min obiettivo`:'Tempo raggiunto'}}else{const e=document.getElementById('emom-timer');if(e)e.textContent=clockFmt(elapsed(s.emomClock))}}
function makeEntry(s,side,gid){const target=s.targets[side];return {id:uid(),side,groupId:gid,exerciseName:target.name,unit:target.unit,target:nval(target.target),value:nval(target.target),progression:target.progression||'',assistance:target.assistance||'',loadKg:nval(target.loadKg),valid:true,rpe:null,quality:'valida',notes:'',elapsedMs:s.clock.startedAt||s.clock.elapsedMs>0?elapsed(s.clock):null,loggedAt:nowISO()}}
function register(side){const s=getSession();if(!s||s.dayType!=='volume')return;const gid=uid();if(side==='pair')s.entries.push(makeEntry(s,'push',gid),makeEntry(s,'pull',gid));else s.entries.push(makeEntry(s,side,gid));save();render();toast(side==='pair'?'Superserie registrata':'Serie registrata')}
function toggleTimer(key){const s=getSession();if(!s)return;const c=s[key]||(s[key]={elapsedMs:0,startedAt:null});if(c.startedAt){c.elapsedMs+=Date.now()-c.startedAt;c.startedAt=null}else c.startedAt=Date.now();save();render()}
function finish(){const s=getSession();if(!s)return;openConfirm('Concludere l’allenamento?','I risultati saranno salvati nello storico e potrai modificarli successivamente.',()=>{if(s.clock?.startedAt){s.clock.elapsedMs=elapsed(s.clock);s.clock.startedAt=null}if(s.emomClock?.startedAt){s.emomClock.elapsedMs=elapsed(s.emomClock);s.emomClock.startedAt=null}s.endedAt=nowISO();data.history.push(s);data.activeSession=null;selectedHistoryId=s.id;screen='history';save();closeModal();render();toast('Allenamento salvato nello storico')})}
function openConfirm(title,desc,yes){currentModal={type:'confirm',yes};modal(`<h2>${esc(title)}</h2><p>${esc(desc)}</p><div class="buttons"><button class="btn secondary" data-action="close-modal">Annulla</button><button class="btn" data-action="confirm-yes">Conferma</button></div>`)}
function modal(html){document.getElementById('modal-root').innerHTML=`<div class="modalback" data-action="close-backdrop"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){document.getElementById('modal-root').innerHTML='';currentModal=null}
function findEntry(sessionId,id){const s=data.activeSession?.id===sessionId?data.activeSession:data.history.find(x=>x.id===sessionId);return {s,e:s?.entries?.find(x=>x.id===id)}}
function editEntry(sessionId,id){const {s,e}=findEntry(sessionId,id);if(!s||!e)return;currentModal={type:'entry',sessionId,id};modal(`<h2>Modifica serie</h2><p>${esc(e.exerciseName)} · ${e.side==='push'?'Spinta':'Tirata'}</p><div class="field-grid"><div class="field"><label>Risultato (${unitLabel(e.unit)})</label><input id="entry-value" type="number" min="0" step="0.5" value="${esc(e.value)}"></div><div class="field"><label>Target iniziale</label><input id="entry-target" type="number" min="0" step="0.5" value="${esc(e.target)}"></div><div class="field"><label>Progressione</label><input id="entry-progression" value="${esc(e.progression||'')}"></div><div class="field"><label>Loop / assistenza</label><input id="entry-assistance" value="${esc(e.assistance||'')}"></div><div class="field"><label>Sovraccarico kg</label><input id="entry-load" type="number" step="0.5" value="${esc(e.loadKg||0)}"></div><div class="field"><label>RPE (facoltativo)</label><input id="entry-rpe" type="number" min="1" max="10" step="0.5" value="${esc(e.rpe??'')}"></div></div><div class="field top-gap"><label>Qualità tecnica</label><select id="entry-quality"><option value="valida" ${e.quality==='valida'?'selected':''}>Valida</option><option value="parziale" ${e.quality==='parziale'?'selected':''}>Parziale</option><option value="non valida" ${e.quality==='non valida'?'selected':''}>Non valida</option></select></div><div class="field top-gap"><label>Note</label><textarea id="entry-notes">${esc(e.notes||'')}</textarea></div><div class="buttons"><button class="btn danger" data-action="delete-entry">Elimina</button><button class="btn" data-action="save-entry">Salva</button></div>`)}
function intensityDialog(s,blockId,index){const b=s.blocks.find(x=>x.id===blockId);if(!b)return;const ex=s.blockLog[blockId]?.[index];currentModal={type:'intensity',sessionId:s.id,blockId,index};modal(`<h2>${esc(b.name)}</h2><p>Serie ${index+1} di ${b.count}. Compila solo ciò che serve.</p><div class="field-grid"><div class="field"><label>Risultato</label><input id="int-val" type="number" min="0" step="0.5" value="${esc(ex?.value??b.target)}"></div><div class="field"><label>Unità</label><select id="int-unit">${unitOptions(ex?.unit||b.unit)}</select></div><div class="field"><label>Loop / assistenza</label><input id="int-assist" value="${esc(ex?.assistance??b.assistance??'')}"></div><div class="field"><label>Progressione</label><input id="int-prog" value="${esc(ex?.progression??b.progression??'')}"></div><div class="field"><label>RPE (facoltativo)</label><input id="int-rpe" type="number" min="1" max="10" step="0.5" value="${esc(ex?.rpe??'')}"></div><div class="field"><label>Sovraccarico kg</label><input id="int-load" type="number" step="0.5" value="${esc(ex?.loadKg??b.loadKg??0)}"></div></div><div class="field top-gap"><label>Qualità</label><select id="int-quality"><option ${ex?.quality==='valida'?'selected':''} value="valida">Valida</option><option ${ex?.quality==='parziale'?'selected':''} value="parziale">Parziale</option><option ${ex?.quality==='non valida'?'selected':''} value="non valida">Non valida</option></select></div><div class="field top-gap"><label>Sequenza / commento libero</label><textarea id="int-notes" placeholder="Es. 5″ hold + 2 press, posizione corretta…">${esc(ex?.notes||'')}</textarea></div><div class="buttons">${ex?'<button class="btn danger" data-action="delete-intensity">Cancella</button>':''}<button class="btn" data-action="save-intensity">${ex?'Salva modifiche':'Registra serie'}</button></div>`)}
function showRound(i,sessionId=null){const s=sessionId?data.history.find(x=>x.id===sessionId):getSession();if(!s)return;const ex=s.emomLog[i];currentModal={type:'round',i,sessionId:s.id};modal(`<h2>Minuto ${i+1}</h2><p>${esc(s.emom.name)} · Registra il risultato del minuto.</p><div class="field-grid"><div class="field"><label>Risultato</label><input id="round-val" type="number" min="0" step="0.5" value="${esc(ex?.value??s.emom.target)}"></div><div class="field"><label>Esito</label><select id="round-valid"><option value="true" ${ex?.valid!==false?'selected':''}>Completato</option><option value="false" ${ex?.valid===false?'selected':''}>Non completato</option></select></div></div><div class="field top-gap"><label>Note</label><textarea id="round-notes">${esc(ex?.notes||'')}</textarea></div><div class="buttons">${ex?'<button class="btn danger" data-action="delete-round">Svuota</button>':''}<button class="btn" data-action="save-round">Salva</button></div>`)}
function openTargetDialog(blockId){const s=getSession(),b=s.blocks.find(x=>x.id===blockId);if(!b)return;currentModal={type:'block-target',blockId};modal(`<h2>Target del blocco</h2><p>Le serie già registrate non cambiano.</p><div class="field-grid"><div class="field"><label>Target</label><input id="bt-target" type="number" min="0" step="0.5" value="${esc(b.target)}"></div><div class="field"><label>Unità</label><select id="bt-unit">${unitOptions(b.unit)}</select></div><div class="field"><label>Progressione</label><input id="bt-prog" value="${esc(b.progression||'')}"></div><div class="field"><label>Assistenza</label><input id="bt-assist" value="${esc(b.assistance||'')}"></div></div><div class="buttons"><button class="btn" data-action="save-block-target">Salva</button></div>`)}
function downloadBackup(){const file=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(file),a=document.createElement('a');a.href=u;a.download='SkillTrack_backup_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup scaricato')}
function italianDate(iso){if(!iso)return 'Data non disponibile';const d=new Date(iso);return isNaN(d.getTime())?'Data non disponibile':d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric'})}
function diaryUnit(u){return u==='seconds'?'"':u==='combo'?' combo':u==='rounds'?' round':''}
function diaryMeta(e){const meta=[];if(e.progression)meta.push(e.progression);if(e.assistance)meta.push('loop/assist: '+e.assistance);if(Number(e.loadKg))meta.push((e.loadKg>0?'+':'')+fmt(e.loadKg,2)+'kg');return meta.length?' ['+meta.join('; ')+']':''}
function diaryOneSide(s,side){const entries=sessionEntries(s).filter(e=>e.side===side&&e.valid!==false);if(!entries.length)return side==='push'?'0 Spinta':'0 Tirata';const byEx=[];for(const e of entries){let ex=byEx.find(x=>x.name===(e.exerciseName||'Esercizio')&&x.unit===e.unit);if(!ex){ex={name:e.exerciseName||'Esercizio',unit:e.unit,entries:[]};byEx.push(ex)}ex.entries.push(e)}return byEx.map(ex=>{const segments=[];for(const e of ex.entries){const sig=[e.value,e.progression||'',e.assistance||'',e.loadKg||0].join('|');const last=segments.at(-1);if(last&&last.sig===sig)last.n++;else segments.push({sig,n:1,e})}const amount=ex.entries.reduce((a,e)=>a+nval(e.value),0);return `${fmt(amount,1)}${diaryUnit(ex.unit)} ${ex.name} (${segments.map(g=>`${g.n}x${fmt(g.e.value,1)}${diaryUnit(g.e.unit)}${diaryMeta(g.e)}`).join(' / ')})`}).join(' ; ')}
function diaryVolumeLine(s,n){const m=summarize(s),invalid=sessionEntries(s).filter(e=>e.valid===false).length;return `W${n} - ${diaryOneSide(s,'push')} + ${diaryOneSide(s,'pull')} | ${m.completePairs} superserie | ${m.sets} serie valide${invalid?' | '+invalid+' non valide':''} | ${italianDate(s.endedAt||s.startedAt)}`}
function diaryIntensityLine(s,n){const blocks=(s.blocks||[]).map(b=>{const values=(s.blockLog?.[b.id]||[]).filter(Boolean),passed=values.filter(e=>e.valid!==false);const pattern=passed.map(e=>`${fmt(e.value,1)}${diaryUnit(e.unit)}${diaryMeta(e)}`).join('/');return `${b.name}: ${passed.length}/${b.count}${pattern?' ('+pattern+')':''}`});const minutes=Object.values(s.emomLog||{});return `W${n} - ${blocks.join(' + ')} | ${s.emom?.name||'Finale'}: ${minutes.filter(e=>e.valid).length}/${s.emom?.minutes||10} min | ${italianDate(s.endedAt||s.startedAt)}`}
function diaryDetails(s){const lines=['  DETTAGLIO:'];if(s.dayType==='volume'){const list=sessionEntries(s);if(!list.length)lines.push('  Nessuna serie registrata');list.forEach((e,i)=>{const attrs=[`${i+1}. ${e.side==='push'?'SPINTA':'TIRATA'} ${e.exerciseName||'Esercizio'}`,`${fmt(e.value,1)}${diaryUnit(e.unit)}`];if(nval(e.value)!==nval(e.target))attrs.push(`target ${fmt(e.target,1)}${diaryUnit(e.unit)}`);if(e.progression)attrs.push('var. '+e.progression);if(e.assistance)attrs.push('loop '+e.assistance);if(nval(e.loadKg))attrs.push('carico '+fmt(e.loadKg,2)+'kg');if(e.rpe)attrs.push('RPE '+e.rpe);attrs.push(e.quality|| (e.valid===false?'non valida':'valida'));if(e.notes)attrs.push('nota '+e.notes.replace(/\s+/g,' '));lines.push('  '+attrs.join(' | '))})}else{for(const b of (s.blocks||[])){lines.push('  '+b.name);const recorded=(s.blockLog?.[b.id]||[]);for(let i=0;i<b.count;i++){const e=recorded[i];if(!e){lines.push(`    ${i+1}. —`);continue}const a=[`${i+1}. ${fmt(e.value,1)}${diaryUnit(e.unit)}`];if(e.progression)a.push('var. '+e.progression);if(e.assistance)a.push('loop '+e.assistance);if(nval(e.loadKg))a.push('carico '+fmt(e.loadKg,2)+'kg');if(e.rpe)a.push('RPE '+e.rpe);a.push(e.quality||(e.valid===false?'non valida':'valida'));if(e.notes)a.push('nota '+e.notes.replace(/\s+/g,' '));lines.push('    '+a.join(' | '))}}lines.push('  '+(s.emom?.name||'FINALE'));for(let i=0;i<(s.emom?.minutes||0);i++){const e=s.emomLog?.[i];if(e)lines.push(`    Min ${i+1}: ${fmt(e.value,1)}${diaryUnit(e.unit)} | ${e.valid?'ok':'non completato'}${e.notes?' | '+e.notes.replace(/\s+/g,' '):''}`)}}if(s.notes)lines.push('  NOTE: '+s.notes.split(/\n/).join('\n  '));return lines.join('\n')}
function buildTextDiary(){const lines=['SKILLTRACK — DIARIO CALISTHENICS','Profilo: '+(data.profile?.name||'Il mio profilo'),'Esportato il: '+new Date().toLocaleString('it-IT'),'','Le righe W1, W2, ... sono riferite alle sessioni del programma attuale.','Formato: 10x3 = 10 serie da 3 ripetizioni; 10x5" = 10 serie da 5 secondi.','Questo documento è modificabile in Note; non sostituisce il backup JSON per il ripristino automatico.','','========================================','ALLENAMENTI DEL PROGRAMMA ATTUALE','========================================'];for(const day of data.days){const sess=data.history.filter(s=>s.dayId===day.id).sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));lines.push('','=== '+(day.weekday||'GIORNO').toUpperCase()+' — '+day.name.toUpperCase()+' ===',day.type==='volume'?`VOLUME - ${day.duration||60} MINUTI`:'INTENSITÀ');if(!sess.length)lines.push('(nessun allenamento completato)');sess.forEach((s,i)=>{lines.push(s.dayType==='volume'?diaryVolumeLine(s,i+1):diaryIntensityLine(s,i+1));lines.push(diaryDetails(s),'')})}if(data.activeSession){const s=data.activeSession;lines.push('','=== SESSIONE IN CORSO (NON ANCORA CONCLUSA) ===',s.dayName||'',s.dayType==='volume'?diaryVolumeLine(s,'*'):diaryIntensityLine(s,'*'),diaryDetails(s))}lines.push('','========================================','STORICO ORIGINALE — ABBREVIAZIONI DEL PDF','========================================');for(const [key,title] of [['volume1','LUNEDÌ VOLUME'],['volume2','GIOVEDÌ VOLUME']]){lines.push('',title);(data.legacyNotes?.[key]||[]).forEach(n=>lines.push(n))}lines.push('','========================================','APPUNTI PERSONALI','========================================',data.manualTextNotes||'(nessun appunto)','','FINE DIARIO');return lines.join('\n')}
function openTextDiary(){currentModal={type:'text-diary'};modal(`<h2>Diario per Note</h2><p>Testo normale, nello stile W1 / W2 del tuo PDF. Puoi modificare questa anteprima, copiarla in Note o scaricare un .txt. Le modifiche fatte qui non cambiano automaticamente i dati delle serie nell'app.</p><textarea id="text-export-content" class="diary-text" spellcheck="false">${esc(buildTextDiary())}</textarea><div class="buttons"><button class="btn" data-action="copy-text-diary">Copia per Note</button><button class="btn secondary" data-action="download-text-diary">Scarica .txt</button><button class="btn secondary" data-action="share-text-diary">Condividi</button><button class="btn secondary" data-action="close-modal">Chiudi</button></div><p class="tip">Per ripristinare i dati di SkillTrack, usa sempre anche Impostazioni → Backup JSON.</p>`)}
function diaryPreviewValue(){return document.getElementById('text-export-content')?.value||buildTextDiary()}
function downloadTextDiary(){const text=diaryPreviewValue(),blob=new Blob(['\ufeff',text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SkillTrack_diario_'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Diario TXT pronto')}
async function copyTextDiary(){const text=diaryPreviewValue();try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const field=document.getElementById('text-export-content');field.focus();field.select();if(!document.execCommand('copy'))throw new Error('Copia non riuscita')}toast('Copiato: apri Note e incolla')}catch(e){toast('Seleziona il testo e usa Copia per incollarlo in Note')}}
async function shareTextDiary(){const text=diaryPreviewValue();if(!navigator.share){copyTextDiary();return}try{await navigator.share({title:'Diario SkillTrack',text})}catch(e){if(e.name!=='AbortError')toast('Condivisione non disponibile: usa Copia per Note')}}
function persistAndRender(){save();render()}
function act(action,button){const s=getSession(),id=button?.dataset?.day;switch(action){case 'goto':editDayId=null;selectedHistoryId=null;go(button.dataset.to);break;case 'settings':go('settings');break;case 'start':startSession(id);break;case 'timer':toggleTimer('clock');break;case 'emom-clock':toggleTimer('emomClock');break;case 'reset-timer':openConfirm('Azzerare il timer?','Le serie registrate non verranno cancellate.',()=>{s.clock={elapsedMs:0,startedAt:null};save();closeModal();render()});break;case 'reset-emom-clock':s.emomClock={elapsedMs:0,startedAt:null};persistAndRender();break;case 'step-target':if(!s||s.dayType!=='volume')return;const ex=s.targets[button.dataset.side];ex.target=clamp(nval(ex.target)+nval(button.dataset.delta),0,99999);persistAndRender();break;case 'add-pair':register('pair');break;case 'add-single':register(button.dataset.side);break;case 'finish':finish();break;case 'delete-active':openConfirm('Eliminare sessione in corso?','Le serie registrate in questa sessione andranno perse.',()=>{data.activeSession=null;save();closeModal();go('home')});break;case 'edit-entry':editEntry(button.dataset.session,button.dataset.entry);break;case 'open-history':selectedHistoryId=button.dataset.session;go('history');break;case 'history-back':selectedHistoryId=null;render();break;case 'delete-history':openConfirm('Eliminare questa sessione?','Questa azione non può essere annullata se non con un backup precedente.',()=>{data.history=data.history.filter(x=>x.id!==button.dataset.session);selectedHistoryId=null;save();closeModal();render()});break;case 'record-intensity':intensityDialog(s,button.dataset.block,Number(button.dataset.index));break;case 'edit-intensity-saved':{const orig=data.history.find(x=>x.id===button.dataset.session);intensityDialog(orig,button.dataset.block,Number(button.dataset.index));break;}case 'edit-block-target':openTargetDialog(button.dataset.block);break;case 'toggle-round':showRound(Number(button.dataset.index));break;case 'edit-round-saved':showRound(Number(button.dataset.index),button.dataset.session);break;case 'edit-plan-day':editDayId=id;render();break;case 'close-edit-day':editDayId=null;render();break;case 'add-day':{const newDay={id:uid(),name:'Nuova giornata',weekday:'Libero',type:'volume',duration:60,warmup:'',conditioning:'',notes:'',push:defaultVolumeEx('Esercizio spinta'),pull:defaultVolumeEx('Esercizio tirata')};currentModal={type:'add-day',day:newDay};modal(`<h2>Nuova giornata</h2><p>La scheda può avere quante giornate vuoi.</p><div class="field"><label>Tipologia</label><select id="add-type"><option value="volume">Volume</option><option value="intensity">Intensità</option></select></div><div class="field top-gap"><label>Nome</label><input id="add-name" value="Nuova giornata"></div><div class="buttons"><button class="btn" data-action="save-new-day">Aggiungi giornata</button></div>`);break;}case 'remove-day':openConfirm('Eliminare giornata?','Gli allenamenti già archiviati non verranno cancellati.',()=>{data.days=data.days.filter(x=>x.id!==id);editDayId=null;save();closeModal();render()});break;case 'add-block':{const d=getDay(editDayId);d.blocks.push(defaultBlock('Nuovo esercizio',3));persistAndRender();break;}case 'delete-block':{const d=getDay(editDayId);if(d.blocks.length<=1){toast('Mantieni almeno un blocco');return}d.blocks=d.blocks.filter(x=>x.id!==button.dataset.block);persistAndRender();break;}case 'save-profile':data.profile.name=document.getElementById('profile-name').value||'Il mio profilo';save();toast('Profilo aggiornato');break;case 'export':downloadBackup();break;case 'open-text-diary':openTextDiary();break;case 'copy-text-diary':copyTextDiary();break;case 'download-text-diary':downloadTextDiary();break;case 'share-text-diary':shareTextDiary();break;case 'import':document.getElementById('backup-file').click();break;case 'close-modal':closeModal();break;case 'close-backdrop':if(button.classList.contains('modalback'))closeModal();break;case 'confirm-yes':if(currentModal?.type==='confirm')currentModal.yes();break;case 'save-new-day':{const type=document.getElementById('add-type').value;const d=currentModal.day;d.name=document.getElementById('add-name').value.trim()||'Nuova giornata';d.type=type;if(type==='intensity'){delete d.push;delete d.pull;d.blocks=[defaultBlock('Combo spinta',2,'combo'),defaultBlock('Combo tirata',2,'combo'),defaultBlock('Power spinta',3),defaultBlock('Power tirata',3)];d.emom={name:'EMOM finale',minutes:10,unit:'reps',target:1}}data.days.push(d);editDayId=d.id;save();closeModal();render();break;}case 'save-entry':{const m=currentModal,{e}=findEntry(m.sessionId,m.id);if(!e)return;e.value=clamp(nval(document.getElementById('entry-value').value),0,99999);e.target=clamp(nval(document.getElementById('entry-target').value),0,99999);e.progression=document.getElementById('entry-progression').value;e.assistance=document.getElementById('entry-assistance').value;e.loadKg=nval(document.getElementById('entry-load').value);e.rpe=document.getElementById('entry-rpe').value?clamp(nval(document.getElementById('entry-rpe').value),1,10):null;e.quality=document.getElementById('entry-quality').value;e.valid=e.quality==='valida';e.notes=document.getElementById('entry-notes').value;save();closeModal();render();break;}case 'delete-entry':{const {s:ses}=findEntry(currentModal.sessionId,currentModal.id);ses.entries=ses.entries.filter(x=>x.id!==currentModal.id);save();closeModal();render();break;}case 'save-intensity':{const m=currentModal,ss=data.activeSession?.id===m.sessionId?data.activeSession:data.history.find(x=>x.id===m.sessionId),bb=ss.blocks.find(x=>x.id===m.blockId),v=ss.blockLog[m.blockId]||[];const quality=document.getElementById('int-quality').value;v[m.index]={id:v[m.index]?.id||uid(),value:clamp(nval(document.getElementById('int-val').value),0,99999),unit:document.getElementById('int-unit').value,target:bb.target,exerciseName:bb.name,progression:document.getElementById('int-prog').value,assistance:document.getElementById('int-assist').value,loadKg:nval(document.getElementById('int-load').value),rpe:document.getElementById('int-rpe').value?clamp(nval(document.getElementById('int-rpe').value),1,10):null,quality,valid:quality==='valida',notes:document.getElementById('int-notes').value,loggedAt:nowISO()};ss.blockLog[m.blockId]=v;save();closeModal();render();break;}case 'delete-intensity':{const m=currentModal,ss=data.activeSession?.id===m.sessionId?data.activeSession:data.history.find(x=>x.id===m.sessionId);delete ss.blockLog[m.blockId][m.index];save();closeModal();render();break;}case 'save-round':{const i=currentModal.i,ss=data.activeSession?.id===currentModal.sessionId?data.activeSession:data.history.find(x=>x.id===currentModal.sessionId);ss.emomLog[i]={value:nval(document.getElementById('round-val').value),unit:ss.emom.unit,valid:document.getElementById('round-valid').value==='true',notes:document.getElementById('round-notes').value,loggedAt:nowISO()};save();closeModal();render();break;}case 'delete-round':{const ss=data.activeSession?.id===currentModal.sessionId?data.activeSession:data.history.find(x=>x.id===currentModal.sessionId);delete ss.emomLog[currentModal.i];save();closeModal();render();break;}case 'save-block-target':{const b=s.blocks.find(x=>x.id===currentModal.blockId);b.target=nval(document.getElementById('bt-target').value);b.unit=document.getElementById('bt-unit').value;b.progression=document.getElementById('bt-prog').value;b.assistance=document.getElementById('bt-assist').value;save();closeModal();render();break;}}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(b.dataset.action==='close-backdrop'&&e.target!==b)return;act(b.dataset.action,b)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='manual-text-notes'){data.manualTextNotes=el.value;save();toast('Appunti testuali salvati');return}if(el.id==='backup-file'){const f=el.files?.[0];if(!f)return;f.text().then(t=>{let parsed;try{parsed=JSON.parse(t)}catch(e){toast('File JSON non valido');return}if(!parsed||parsed.version!==1||!Array.isArray(parsed.days)||!Array.isArray(parsed.history)||!parsed.profile){toast('Backup non compatibile');return}openConfirm('Importare backup?','I dati attuali sul dispositivo saranno sostituiti. Esportali prima, se vuoi conservarli.',()=>{data=parsed;save();closeModal();selectedHistoryId=null;editDayId=null;go('home');toast('Backup importato')})});return}if(el.dataset.targetField){const s=getSession();if(!s)return;const x=s.targets[el.dataset.side],f=el.dataset.targetField;x[f]=['target','loadKg'].includes(f)?nval(el.value):el.value;save();render();return}if(el.id==='stats-day'){statDayId=el.value;render();return}if(el.dataset.historyNotes){const s=data.history.find(x=>x.id===el.dataset.historyNotes);if(s){s.notes=el.value;save();toast('Note salvate')}return}const d=getDay(editDayId);if(!d)return;let obj=null,field=null;if(el.dataset.dayField){obj=d;field=el.dataset.dayField}else if(el.dataset.exField){obj=d[el.dataset.side];field=el.dataset.exField}else if(el.dataset.blockField){obj=d.blocks.find(b=>b.id===el.dataset.block);field=el.dataset.blockField}else if(el.dataset.emomField){obj=d.emom;field=el.dataset.emomField}if(obj&&field){obj[field]=['target','count','duration','minutes','loadKg'].includes(field)?nval(el.value):el.value;if(['count','minutes','duration'].includes(field))obj[field]=clamp(Math.round(obj[field]),1,360);save();toast('Modifica salvata')}});
// Auto-save e timer: salvati all'avvio/pausa e ad ogni serie; il tempo usa timestamp reali.
setInterval(updateTimers,1000);
window.addEventListener('beforeunload',()=>{if(data.activeSession)save()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
